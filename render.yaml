services:
  - type: web
    name: lhl-hockey
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /teams
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'false'
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_ROLE
        value: admin
